<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>아이디 및 비밀번호 찾기 | 이해했슈</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/find.css') }}"
    />
  </head>
  <body>
    <div class="find-container">
      <h2>계정 찾기</h2>

      <div class="tabs">
        <button class="tab-button active" onclick="openTab(event, 'find-id')">
          아이디 찾기
        </button>
        <button class="tab-button" onclick="openTab(event, 'find-pw')">
          비밀번호 찾기
        </button>
      </div>

      <div id="find-id" class="tab-content active">
        <form id="find-id-form">
          <div class="input-group">
            <label for="find-name">이름</label>
            <input
              type="text"
              id="find-name"
              placeholder="가입 시 등록한 이름을 입력하세요"
              required
            />
          </div>
          <div class="input-group">
            <label for="email-for-id">이메일</label>
            <input
              type="email"
              id="email-for-id"
              placeholder="가입 시 등록한 이메일을 입력하세요"
              required
            />
          </div>
          <button type="submit" class="submit-btn">아이디 찾기</button>
        </form>
      </div>

      <div id="find-pw" class="tab-content">
        <form id="find-pw-form">
          <div class="input-group">
            <label for="email-for-pw">이메일</label>
            <input
              type="email"
              id="email-for-pw"
              name="email"
              placeholder="가입 시 등록한 이메일을 입력하세요"
              required
            />
          </div>
          <button type="submit" class="submit-btn">재설정 링크 받기</button>
        </form>
      </div>

      <div class="links">
        <a href="{{ url_for('auth.login') }}">로그인 페이지로 돌아가기</a>
      </div>
    </div>

    <div id="result-modal" class="modal-backdrop">
      <div class="modal-content">
        <h3 id="modal-title-text">아이디 찾기 결과</h3>
        <p id="modal-message-text"></p>
        <button class="close-btn" id="close-modal-btn">확인</button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="{{ url_for('static', filename='js/find.js') }}"></script>
  </body>
</html>
